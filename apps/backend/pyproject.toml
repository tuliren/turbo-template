[tool.poetry]
name = "repo-backend"
version = "0.1.0"
description = "A FastAPI server backend"
authors = ["Liren Tu"]
readme = "README.md"
packages = [
    { include = "app" }
]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.162.0"
uvicorn = "^0.54.0"
pydantic = "^2.14.2"
pytest = "^9.2.0"
pytest-asyncio = "^1.4.1.post1"
flake8 = "^7.5.0"
pylint = "^4.1.3"
mypy = "^2.4.1"
black = "^26.10.1"
isort = "^9.0.2"
fastapi-cli = "^0.0.32"
pytest-cov = "^7.1.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pylint.messages_control]
disable = [
    "missing-docstring",
    "invalid-name",
]

[tool.pylint.format]
max-line-length = 88

[tool.pytest.ini_options]
testpaths = ["app/**/__tests__"]
python_files = "*_test.py"
python_functions = "test_*"
